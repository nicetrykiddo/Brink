[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brink-agent-supervisor"
version = "0.1.0"
description = "Offline telemetry replay and experimental supervisor for autonomous agents"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["brink*"]
